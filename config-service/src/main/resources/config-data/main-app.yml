server:
  port: ${PORT:${SERVER_PORT:0}}

spring:
  application:
    name: main-app
  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: root
    password: password
    driver-class-name: org.postgresql.Driver
  jooq:
    sql-dialect: postgres
  web:
    resources:
      add-mappings: false
  main:
    allow-bean-definition-overriding: true

logging:
  level:
    org:
      jooq:
        tools:
          LoggerListener: DEBUG
        impl:
          DefaultExecuteListener: DEBUG

