server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: main-app
            uri: lb://main-app
            predicates:
              - Path= /api/company/**
              - Path= /api/invoice/**
              - Path= /api/product/**
          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path= /auth/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG